<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders – ShopEase</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header id="app-header"></header>

    <main>
        <h1>My Orders</h1>

        <div data-testid="orders-empty" hidden>
            <p class="muted">You have no orders yet.</p>
            <a href="/products.html" class="button" data-testid="start-shopping">Start shopping</a>
        </div>

        <table data-testid="orders-table" hidden>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th class="text-right">Total</th>
                </tr>
            </thead>
            <tbody data-testid="orders-list"></tbody>
        </table>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/orders.js"></script>
</body>

</html>
